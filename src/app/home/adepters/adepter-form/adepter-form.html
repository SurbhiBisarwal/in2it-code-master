<div class="overlay">
    <div class="popup">
        <div>
            <img src="close.svg" alt="close" (click)="close()" />
        </div>


        <form [formGroup]="adepterForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" formControlName="name" />

                <label for="age">Age</label>
                <input type="number" id="age" formControlName="age" />

                <label for="grade">Grade</label>
                <input type="text" id="grade" formControlName="grade" />

                <label for="course">Course</label>
                <input type="text" id="course" formControlName="course" />

                <label for="email">Email</label>
                <input type="email" id="email" formControlName="email" />
            </div>
            <button type="submit" [disabled]="adepterForm.invalid">Submit</button>
        </form>
    </div>
</div>
