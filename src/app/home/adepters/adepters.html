<div>
  <div style="display: flex; justify-content: space-between;">
    <img src="addBox.svg" alt="add" style="background-color: black" (click)="onclick()" />
    <div style="display: flex;margin-right: 10%;">
      <!-- <img src="editDetail.svg" alt="delete" style="margin-right: 10%;" (click)="onUpdate()" /> -->
      <img src="view.svg" alt="delete" style="margin-right: 10%;" (click)="viewDetails()" />
      <!-- <img src="delete.svg" alt="delete"  (click)="onDelete()" /> -->
    </div>

  </div>
  <cats-data-grid [rowData]="filteredRows()" [colDefs]="coldef" checkboxSelectionType="multiple"  [threeDotsMenuRequired]="true"
    [checkBoxSelection]="true" (onCheckboxSelection)="onSelectedRows($event)" ></cats-data-grid>

</div>



<!-- inline template version of the form -->
<ng-template #formTemplate let-data="data">
  <app-adepter-form [studentData]="data" (closed)="onFormClosed()"></app-adepter-form>
</ng-template>

@if(showForm()){
  <ng-container [ngTemplateOutlet]="formTemplate" [ngTemplateOutletContext]="{data: currentStudent}"></ng-container>
}
